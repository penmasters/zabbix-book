name: Build and deploy versioned book

on:
  push:
    branches:
      - main
      - "release/**"
      - "translation/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out build controller
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch all declared source branches
        run: git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Read GitHub Pages URL
        id: pages
        uses: actions/configure-pages@v5

      - name: Build every declared website version
        run: |
          python tools/build_versioned_site.py \
            --repository . \
            --metadata .github/docs-versions.yml \
            --output .build/site \
            --base-url "${{ steps.pages.outputs.base_url }}/"

      - name: Validate selector, navigation, assets, search, and links
        run: python tools/validate_versioned_site.py .build/site --metadata .github/docs-versions.yml

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .build/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
