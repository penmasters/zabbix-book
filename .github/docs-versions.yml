# Single source of truth for release and translation branches. The builder,
# selector, validator, and release documentation use entries with website: true.
# Entries with website: false remain declared without being published.
default_path: main/

versions:
  - id: main
    label: Main (Development)
    branch: main
    language: en
    path: main/
    aliases:
      - en/
    status: development
    website: true
    base:
      type: branch
      ref: main
  - id: release-8.0
    label: 8.0 — English
    branch: release/8.0
    language: en
    path: 8.0/en/
    status: maintenance
    website: false
    base:
      type: branch
      ref: main
    published_tag: v8.0-1
  - id: german-8.0
    label: 8.0 — German
    branch: translation/8.0/de
    language: de
    path: 8.0/de/
    aliases:
      - de/
    status: development
    website: false
    base:
      type: tag
      ref: v8.0-1
    published_tag: v8.0-1-de.1
